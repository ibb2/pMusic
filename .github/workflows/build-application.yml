name: Build Application

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-application:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-extension: zip
            release-file: rayna-windows-installer.zip
            codesign-identity: ""
          - os: macos-latest
            artifact-extension: dmg
            release-file: rayna-macos.dmg
            codesign-identity: "-"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Rayna
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.codesign-identity }}
        run: bun run build:stable

      - name: Normalize release artifact name
        shell: bash
        run: |
          artifact="$(find dist/electrobun -type f -name '*.${{ matrix.artifact-extension }}' -print -quit)"
          target="dist/${{ matrix.release-file }}"

          if [[ -z "$artifact" ]]; then
            echo "No .${{ matrix.artifact-extension }} release artifact was produced for ${{ matrix.os }}" >&2
            exit 1
          fi

          mv "$artifact" "$target"

      - name: Re-encode macOS DMG without outer signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          signed_dmg="dist/rayna-macos.dmg"
          unsigned_dmg="dist/rayna-macos-unsigned.dmg"

          diskutil image create from --format ULFO "$signed_dmg" "$unsigned_dmg"
          mv "$unsigned_dmg" "$signed_dmg"

          if codesign -d "$signed_dmg" >/dev/null 2>&1; then
            echo "The release DMG still has an outer code signature" >&2
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rayna-${{ matrix.os }}
          path: dist/${{ matrix.release-file }}
          if-no-files-found: error

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.release-file }}
          fail_on_unmatched_files: true
